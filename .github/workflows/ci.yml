name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '55 17 * * *'
  workflow_dispatch: # Allows you to manually trigger the workflow from the GitHub UI

jobs:
  test-unit:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    container:
      image: node:${{ matrix.node-version }}
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload unit test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ matrix.node-version }}
          path: .

  test-integration:
    name: Integration tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    container:
      image: node:${{ matrix.node-version }}
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration

      - name: Upload integration test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-${{ matrix.node-version }}
          path: .

  test-load:
    name: Load tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    container:
      image: node:${{ matrix.node-version }}
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run load tests
        run: npm run test:load

      - name: Upload load test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-tests-${{ matrix.node-version }}
          path: .

  test-e2e:
    name: E2E tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    container:
      image: node:${{ matrix.node-version }}
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Chrome/Chromium dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            fonts-liberation \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libx11-xcb1 \
            libxcb1 \
            libasound2 \
            libxss1 \
            libgtk-3-0 \
            libdbus-1-3
          rm -rf /var/lib/apt/lists/*

      - name: Install dependencies
        run: npm ci

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload e2e test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-tests-${{ matrix.node-version }}
          path: .
