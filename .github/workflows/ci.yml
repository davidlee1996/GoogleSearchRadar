name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '55 17 * * *'
  workflow_dispatch: # Allows you to manually trigger the workflow from the GitHub UI

jobs:
  test-unit:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    container:
      image: node:${{ matrix.node-version }}
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests and generate HTML report
        run: npm run test:unit -- --reporters=default --reporters=jest-html-reporter --reporter-options=outputPath=reports/jest/unit-${{ matrix.node-version }}.html

      - name: Upload unit test HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-report-unit-${{ matrix.node-version }}
          path: reports/jest

  test-integration:
    name: Integration tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    container:
      image: node:${{ matrix.node-version }}
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests and generate HTML report
        run: npm run test:integration -- --reporters=default --reporters=jest-html-reporter --reporter-options=outputPath=reports/jest/integration-${{ matrix.node-version }}.html

      - name: Upload integration test HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-report-integration-${{ matrix.node-version }}
          path: reports/jest

  test-load:
    name: Load tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    container:
      image: node:${{ matrix.node-version }}
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run load tests and generate HTML report
        run: npm run test:load -- --reporters=default --reporters=jest-html-reporter --reporter-options=outputPath=reports/jest/load-${{ matrix.node-version }}.html

      - name: Upload load test HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-report-load-${{ matrix.node-version }}
          path: reports/jest

  test-e2e:
    name: E2E tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    container:
      image: node:${{ matrix.node-version }}
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Chrome/Chromium dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            fonts-liberation \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libx11-xcb1 \
            libxcb1 \
            libasound2 \
            libxss1 \
            libgtk-3-0 \
            libdbus-1-3
          rm -rf /var/lib/apt/lists/*

      - name: Install dependencies
        run: npm ci

      - name: Run e2e tests and generate HTML report
        run: npm run test:e2e -- --reporters=default --reporters=jest-html-reporter --reporter-options=outputPath=reports/jest/e2e-${{ matrix.node-version }}.html

      - name: Upload e2e test HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-report-e2e-${{ matrix.node-version }}
          path: reports/jest

  publish-pages:
    name: Publish test reports to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, test-load, test-e2e]
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all test report artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-reports

      - name: Prepare public directory
        run: |
          mkdir -p public
          cp -R test-reports/* public/ || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
